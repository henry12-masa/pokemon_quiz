const pokemonTypes = [

["ゲンガー","ゴースト"],["カイリュー","ドラゴン"],["ギャラドス","みず"],["ラプラス","みず"],
["カビゴン","ノーマル"],["ルカリオ","かくとう"],["ガブリアス","ドラゴン"],["サーナイト","エスパー"],
["ブラッキー","あく"],["ニンフィア","フェアリー"],["ハッサム","むし"],["メタグロス","はがね"],
["バンギラス","いわ"],["ゲッコウガ","みず"],["ジュカイン","くさ"],["バシャーモ","ほのお"],
["ラグラージ","みず"],["エンペルト","みず"],["ゴウカザル","ほのお"],["ドダイトス","くさ"],
["ミミッキュ","ゴースト"],["ドラパルト","ドラゴン"],["エースバーン","ほのお"],["ゴリランダー","くさ"],
["インテレオン","みず"],["マスカーニャ","くさ"],["ラウドボーン","ほのお"],["ウェーニバル","みず"]
];

function shuffleArray(array){
  const copied = [...array];
  for(let i = copied.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copied[i], copied[j]] = [copied[j], copied[i]];
  }
  return copied;
}

function makeChoices(correct, pool){
  const wrongs = shuffleArray(pool.filter(x => x !== correct)).slice(0,3);
  return shuffleArray([correct,...wrongs]);
}

function buildQuestionBank(){
  const questions = [];
  const seen = new Set();

  function add(q,c,a){
    if(seen.has(q)) return;
    seen.add(q);
    questions.push({q,c,a});
  }

  const typeNames = typeFacts.map(x=>x.t);
  const regionsOnly = regions.map(x=>x[0]);
  const towns = regions.map(x=>x[1]);
  const professors = regions.map(x=>x[2]);
  const pokemonNames = [...new Set([
    ...evolutions.flat(),
    ...legendary.map(x=>x[0]),
    ...pokemonTypes.map(x=>x[0]),
    ...starters.flatMap(x=>[x.grass,x.fire,x.water])
  ])];

  typeFacts.forEach(x=>{
    add(`${x.t}タイプが弱点になりやすいタイプは？`, makeChoices(x.weak,typeNames), x.weak);
    add(`${x.t}タイプの技が効果ばつぐんになりやすい相手は？`, makeChoices(x.strong,typeNames), x.strong);
    add(`${x.t}タイプの技が効かない、または無効になりやすい相手は？`, makeChoices(x.no,typeNames.concat(["なし"])), x.no);
    add(`${x.weak}タイプの技を受けると弱点を突かれやすいのは？`, makeChoices(x.t,typeNames), x.t);
    add(`${x.strong}タイプに強く出やすい攻撃タイプは？`, makeChoices(x.t,typeNames), x.t);
  });

  starters.forEach(s=>{
    add(`${s.region}地方のくさタイプ御三家は？`, makeChoices(s.grass,pokemonNames), s.grass);
    add(`${s.region}地方のほのおタイプ御三家は？`, makeChoices(s.fire,pokemonNames), s.fire);
    add(`${s.region}地方のみずタイプ御三家は？`, makeChoices(s.water,pokemonNames), s.water);
    add(`${s.grass}・${s.fire}・${s.water}が最初のパートナーとして登場する地方は？`, makeChoices(s.region,regionsOnly), s.region);
    add(`${s.grass}のタイプは？`, makeChoices("くさ",typeNames), "くさ");
    add(`${s.fire}のタイプは？`, makeChoices("ほのお",typeNames), "ほのお");
    add(`${s.water}のタイプは？`, makeChoices("みず",typeNames), "みず");
  });

  regions.forEach(r=>{
    add(`${r[0]}地方で冒険が始まる代表的な町は？`, makeChoices(r[1],towns), r[1]);
    add(`${r[0]}地方に関係が深い博士・人物は？`, makeChoices(r[2],professors), r[2]);
    add(`${r[1]}はどの地方の町？`, makeChoices(r[0],regionsOnly), r[0]);
    add(`${r[2]}と関係が深い地方は？`, makeChoices(r[0],regionsOnly), r[0]);
  });

  evolutions.forEach(e=>{
    add(`${e[0]}が進化すると？`, makeChoices(e[1],pokemonNames), e[1]);
    add(`${e[1]}の進化前は？`, makeChoices(e[0],pokemonNames), e[0]);
  });

  legendary.forEach(l=>{
    add(`${l[0]}と関係が深い地方は？`, makeChoices(l[1],regionsOnly), l[1]);
    add(`${l[1]}地方に関係が深い伝説・幻のポケモンは？`, makeChoices(l[0],legendary.map(x=>x[0])), l[0]);
  });

  pokemonTypes.forEach(p=>{
    add(`${p[0]}の代表的なタイプは？`, makeChoices(p[1],typeNames), p[1]);
    add(`${p[1]}タイプのポケモンはどれ？`, makeChoices(p[0],pokemonTypes.map(x=>x[0])), p[0]);
  });

  const extra = [
    ["モンスターボールは何をする道具？","ポケモンを捕まえる","体力を回復する","技を忘れさせる","進化を止める"],
    ["ポケモンセンターで主にできることは？","ポケモンを回復する","バッジを買う","タイプを変更する","図鑑番号を変える"],
    ["ジムリーダーに勝つともらえることが多いものは？","バッジ","モンスターボールの空箱","化石だけ","自転車の鍵だけ"],
    ["ポケモン図鑑の主な役割は？","ポケモンの情報を記録する","お金を増やす","天気を変える","技を無限にする"],
    ["色違いポケモンとは？","通常と色が違う珍しい個体","必ず伝説の個体","進化できない個体","道具の名前"],
    ["タマゴから生まれるものは？","ポケモン","ジムバッジ","わざマシン","きのみの木"],
    ["わざマシンの主な用途は？","技を覚えさせる","ポケモンを捕まえる","町へ移動する","名前を変える"],
    ["きのみの用途として近いものは？","回復や状態異常対策","ジムを作る","地方を変える","図鑑を消す"],
    ["ポケモンバトルでHPが0になる状態は？","ひんし","進化","捕獲","交換"],
    ["通信交換でできることは？","他の人とポケモンを交換する","必ず色違いにする","全員を進化させる","タイプを消す"]
  ];

  for(let i=0;i<extra.length;i++){
    const e = extra[i];
    add(e[0], shuffleArray([e[1],e[2],e[3],e[4]]), e[1]);
  }

  let n = 1;
  while(questions.length < TOTAL_COUNT){
    const t = typeFacts[n % typeFacts.length];
    const s = starters[n % starters.length];
    const e = evolutions[n % evolutions.length];
    const p = pokemonTypes[n % pokemonTypes.length];

    add(`総合問題${n}：${s.region}地方の御三家のうち、ほのおタイプは？`, makeChoices(s.fire,pokemonNames), s.fire);
    add(`総合問題${n}：${e[0]}の次の進化先として正しいものは？`, makeChoices(e[1],pokemonNames), e[1]);
    add(`総合問題${n}：${p[0]}の代表的なタイプは？`, makeChoices(p[1],typeNames), p[1]);
    add(`総合問題${n}：${t.t}タイプが苦手としやすいタイプは？`, makeChoices(t.weak,typeNames), t.weak);
    n++;
  }

  return questions.slice(0,TOTAL_COUNT);
}

const allQuestions = buildQuestionBank();

let quizData = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");
const progressEl = document.getElementById("progress");
const restartBtn = document.getElementById("restartBtn");

function startQuiz(){
  quizData = shuffleArray(allQuestions).slice(0, QUESTION_COUNT);
  currentQuestion = 0;
  score = 0;
  restartBtn.style.display = "none";
  loadQuestion();
}

function loadQuestion(){
  answered = false;
  resultEl.textContent = "";
  const q = quizData[currentQuestion];

  progressEl.textContent = `${currentQuestion + 1} / ${quizData.length}問目　正解数：${score}　総問題数：${allQuestions.length}`;
  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";

  q.c.forEach(choice=>{
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(btn,choice);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(button, choice){
  if(answered) return;
  answered = true;

  const correctAnswer = quizData[currentQuestion].a;
  const buttons = choicesEl.querySelectorAll("button");

  buttons.forEach(btn=>{
    btn.disabled = true;
    if(btn.textContent === correctAnswer){
      btn.classList.add("correct");
    }
  });

  if(choice === correctAnswer){
    score++;
    resultEl.textContent = "正解！";
    button.classList.add("correct");
  }else{
    resultEl.textContent = `不正解… 正解は「${correctAnswer}」`;
    button.classList.add("wrong");
  }

  setTimeout(()=>{
    currentQuestion++;
    if(currentQuestion < quizData.length){
      loadQuestion();
    }else{
      showFinalResult();
    }
  },1200);
}

function showFinalResult(){
  questionEl.textContent = "クイズ終了！";
  choicesEl.innerHTML = "";
  resultEl.innerHTML = `あなたの正解数は <strong>${score} / ${quizData.length}</strong> 問です。`;
  progressEl.textContent = "";
  restartBtn.style.display = "inline-block";
}

function restartQuiz(){
  startQuiz();
}

startQuiz();
</script>
